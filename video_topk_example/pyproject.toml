[project]
name = "video-topk"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "data-joinery[pyspark,vis]==0.4.0",
    "pyspark==4.1.0",
    "delta-spark==4.1.0",
    # Spark 4.1's pandas integration uses internals removed in pandas 3.
    "pandas>=2.3.3,<3",
    "pyarrow>=18",
    "protobuf>=5.28.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_topk"]
