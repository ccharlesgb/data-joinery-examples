[project]
name = "sklearn-spark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.1",
    "polars>=1.44.2",
    "pyarrow>=18",
    "scikit-learn>=1.9.1",
    "data-joinery[pyspark,polars,vis]>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sklearn_spark"]
