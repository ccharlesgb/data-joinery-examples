[project]
name = "data-joinery-examples"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.1",
    "polars>=1.44.2",
    "pyarrow>=18",
    "data-joinery>=0.1.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "library-skills>=0.0.19",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["./*/tests"] 

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
search-path = [
    "order_product_example/src",
    "snapshot_diff_example/src",
    "customer_group_example/src",
    "housing_linear_regression_example/src",
    "sklearn_spark_example/src",
]

[tool.uv.workspace]
members = [
    "customer_group_example",
    "order_product_example",
    "snapshot_diff_example",
    "housing_linear_regression_example",
    "sklearn_spark_example",
]
